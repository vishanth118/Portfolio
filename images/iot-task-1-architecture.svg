<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 web-based LED control system</title>
  <desc id="desc">A browser sends an ON or OFF command over Wi-Fi to an ESP32 web server, which controls an LED through GPIO 2.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171316"/><stop offset="1" stop-color="#29201d"/></linearGradient><linearGradient id="accent" x2="1"><stop stop-color="#ffc928"/><stop offset="1" stop-color="#ff763e"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".35"/></filter></defs>
  <rect width="1000" height="650" rx="28" fill="url(#bg)"/><text x="500" y="76" fill="#ffc928" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="4" text-anchor="middle">ESP32 WEB LED CONTROL</text><text x="500" y="111" fill="#d2c7c0" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Browser command → Wi-Fi → physical output</text>
  <g filter="url(#shadow)" font-family="Arial,sans-serif" text-anchor="middle"><rect x="65" y="245" width="195" height="190" rx="18" fill="#211c1d" stroke="#504137"/><rect x="402" y="245" width="195" height="190" rx="18" fill="#211c1d" stroke="#504137"/><rect x="740" y="245" width="195" height="190" rx="18" fill="#211c1d" stroke="#504137"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle"><text x="162" y="285" fill="#f0c993" font-size="16" font-weight="700">WEB BROWSER</text><rect x="100" y="305" width="65" height="42" rx="8" fill="#ffc928"/><rect x="177" y="305" width="65" height="42" rx="8" fill="#382d28" stroke="#ff763e"/><text x="132" y="332" fill="#24180b" font-size="14" font-weight="700">ON</text><text x="209" y="332" fill="#f7f2ed" font-size="14" font-weight="700">OFF</text><text x="162" y="384" fill="#b6aaa3" font-size="14">HTTP command</text>
  <text x="499" y="285" fill="#f0c993" font-size="16" font-weight="700">ESP32</text><rect x="441" y="305" width="117" height="63" rx="10" fill="#283638" stroke="#5e9990"/><text x="499" y="332" fill="#e5f3ec" font-size="15" font-weight="700">WEB SERVER</text><text x="499" y="354" fill="#b6aaa3" font-size="13">GPIO 2</text><text x="499" y="399" fill="#b6aaa3" font-size="14">Wi-Fi enabled MCU</text>
  <text x="837" y="285" fill="#f0c993" font-size="16" font-weight="700">LED OUTPUT</text><circle cx="837" cy="338" r="26" fill="#ffc928"/><path d="M827 365h20v15h-20z" fill="#b6aaa3"/><path d="M827 380h20v8h-20z" fill="#77706b"/><text x="837" y="414" fill="#b6aaa3" font-size="14">HIGH = ON · LOW = OFF</text></g>
  <g fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M275 340h105"/><path d="m365 327 14 13-14 13"/><path d="M615 340h105"/><path d="m705 327 14 13-14 13"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#b6aaa3" font-size="14"><text x="328" y="318">ON / OFF</text><text x="668" y="318">GPIO 2</text><text x="500" y="530" fill="#ffc928" font-size="15" font-weight="700">BOTH DEVICES CONNECT TO THE SAME LOCAL WI-FI NETWORK</text><text x="500" y="563">Open the ESP32 IP address in a browser to use the control page.</text></g>
</svg>

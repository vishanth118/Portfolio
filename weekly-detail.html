<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protosem | Weekly Detail</title>
<style>
:root{--navy:#08182f;--blue:#39c6ff;--ink:#17233a}*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}body{background:#f4faff;color:var(--ink);line-height:1.6}header{background:var(--navy);padding:54px 20px;color:#fff}header>div,main{width:min(920px,90%);margin:auto}.eyebrow{color:#67d8ff;font-size:.82rem;font-weight:bold;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(2rem,5vw,3.4rem);margin:5px 0}header p{color:#c8eefa}main{padding:38px 0 64px}.section{background:#fff;border-radius:17px;padding:27px 29px;box-shadow:0 10px 25px rgba(8,24,47,.08);margin-bottom:22px}.section h2{font-size:1.2rem;margin-bottom:10px}.section p{color:#506078}.activity-list{display:grid;gap:15px}.activity-list h3{font-size:1rem;color:var(--navy);margin-bottom:3px}.tags{display:flex;flex-wrap:wrap;gap:10px}.tag{background:#e8f8ff;color:#087cab;border:1px solid #b9eaff;border-radius:999px;padding:7px 12px;font-size:.9rem;font-weight:bold}.back{display:inline-block;text-decoration:none;background:#0a84bb;color:white;padding:11px 17px;border-radius:9px;font-weight:bold}.back:hover{background:#056b9a}@media(max-width:600px){.section{padding:22px}}
</style>
</head>
<body>
<header><div><div class="eyebrow" id="week-label">Protosem weekly record</div><h1 id="title">Weekly Progress</h1><p id="summary"></p></div></header>
<main>
<section class="section"><h2>What we did this week</h2><div id="details"></div></section>
<section class="section" id="achievements-section"><h2>Achievements</h2><div class="tags" id="achievement-tags"><span class="tag">Teamwork</span><span class="tag">Creativity</span><span class="tag">Problem solving</span><span class="tag">Communication</span></div></section>
<a class="back" href="protosem.html">← Back to weekly progress</a>
</main>
<script>
const milestones=[['Getting started','Introduced the Protosem program, set goals, and mapped the learning journey.'],['Foundation building','Strengthened the core concepts needed for the project work ahead.'],['Learning presentation','Developed programming fundamentals, innovation thinking, and problem-solving skills through hands-on learning.'],['Research phase','Collected references, studied existing solutions, and noted requirements.'],['Planning the build','Defined the workflow, resources, and first implementation tasks.'],['Skill practice','Practised the key technical skills required for the selected project.'],['Early prototype','Created an initial proof of concept and identified improvement areas.'],['Testing assumptions','Tested the prototype approach and documented what worked.'],['Iteration one','Refined the design based on observations and feedback.'],['Midpoint review','Reviewed progress, challenges, and priorities for the next stage.'],['Development sprint','Focused on building the main project features.'],['Integration work','Connected the individual parts into a more complete system.'],['Performance checks','Measured results and looked for reliability improvements.'],['Problem solving','Addressed issues found during testing and tuned the solution.'],['Feature refinement','Improved usability, performance, and presentation.'],['Documentation','Organized the work, decisions, and evidence from the journey.'],['Feedback loop','Collected feedback and used it to make final adjustments.'],['Final testing','Validated the completed work against the original goals.'],['Showcase preparation','Prepared the project story, demonstrations, and key outcomes.'],['Journey recap','Reviewed achievements, lessons learned, and next steps.'],['Next steps','Outlined the next goals and opportunities to continue the Protosem journey.']];
const requested=Number(new URLSearchParams(location.search).get('week')),week=requested>=0&&requested<milestones.length?requested:0,[title,summary]=milestones[week],details=document.getElementById('details'),achievements=document.getElementById('achievements-section'),tags=document.getElementById('achievement-tags');document.title=`Protosem | Week ${week}`;document.getElementById('week-label').textContent=`Protosem · Week ${week}`;document.getElementById('title').textContent=title;document.getElementById('summary').textContent=summary;if(week===0){details.innerHTML='<div class="activity-list"><div><h3>Self introduction</h3><p>Introduced myself, shared my interests, and explained what I hope to learn through Protosem.</p></div><div><h3>Orientation</h3><p>Learned about the Protosem program, its goals, the weekly process, and the expectations for the journey.</p></div><div><h3>Group activities</h3><p>Worked with other participants in introductory activities to connect, exchange ideas, and begin collaborating.</p></div></div>'}else if(week===1){details.innerHTML='<div class="activity-list"><div><h3>Implementation of 5S</h3><p>Applied the 5S method—Sort, Set in order, Shine, Standardize, and Sustain—to keep the workspace organised, clean, and efficient.</p></div><div><h3>GitHub introduction</h3><p>Learned how GitHub is used to store project files, track changes, and collaborate through repositories.</p></div><div><h3>Creating portfolio</h3><p>Created a personal portfolio to present my skills, projects, and learning progress in a professional digital space.</p></div></div>';tags.innerHTML='<span class="tag">Organization</span><span class="tag">Workplace discipline</span><span class="tag">Self presentation</span><span class="tag">Digital presence</span><span class="tag">Efficiency</span>'}else if(week===2){details.innerHTML='<div class="activity-list"><div><h3>Monday — Frugal Innovation and GIE Rubrics</h3><p>Learned to create simple, low-cost solutions that meet real user needs. I also understood how projects are assessed through problem identification, innovation, teamwork, presentation, implementation, impact, and execution.</p></div><div><h3>Tuesday — Algorithms and Flowcharts</h3><p>Practised breaking problems into clear step-by-step algorithms and using flowcharts to visualise program logic before coding. Planning solutions first helps reduce errors.</p></div><div><h3>Wednesday — Scratch and Python Basics</h3><p>Created animations and stories in Scratch using sprites, backdrops, events, loops, and conditions. Learned Python fundamentals including syntax, variables, input/output, comments, indentation, print(), and input().</p></div><div><h3>Thursday — MIT App Inventor and Scratch Project Planning</h3><p>Designed simple Android app interfaces with drag-and-drop components and explored event-driven blocks. I also planned a Scratch project by identifying its story, characters, scenes, and programming logic.</p></div><div><h3>Friday — Design Thinking</h3><p>Learned the five stages of Design Thinking: Empathize, Define, Ideate, Prototype, and Test. This reinforced the importance of understanding users and improving solutions through testing.</p></div></div>';tags.innerHTML='<span class="tag">Problem solving</span><span class="tag">Logical thinking</span><span class="tag">Programming fundamentals</span><span class="tag">Innovation mindset</span><span class="tag">Design thinking</span><span class="tag">Creativity</span><span class="tag">Teamwork</span><span class="tag">Presentation skills</span>'}else{details.textContent=`${summary} This page is the dedicated record for Week ${week}, where the work completed and outcomes can be presented.`;achievements.hidden=true}
</script>
</body>
</html>

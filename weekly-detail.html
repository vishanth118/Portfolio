<main>

<section class="section" id="achievements-section"><h2>Skills and Takeaways</h2><div class="tags" id="achievement-tags"><span class="tag">Teamwork</span><span class="tag">Creativity</span><span class="tag">Problem solving</span><span class="tag">Communication</span></div></section>
<a class="back" href="protosem.html">← Back to weekly progress</a>
</main>
<script>
const milestones=[['Getting started','Introduced the Protosem program, set goals, and mapped the learning journey.'],['Foundation building','Strengthened the core concepts needed for the project work ahead.'],['Learning presentation','Developed programming fundamentals, innovation thinking, and problem-solving skills through hands-on learning.'],['Hardware to product design','Explored computational hardware and electronics, then applied design skills through physical prototyping and 3D CAD modelling.'],['Digital fabrication and Alpha team','Explored laser cutting and 3D printing, and marked the final formation of the Alpha team.'],['User experience and project planning','Studied user-centred design and problem framing, then explored project management and mind mapping with a Bosch industry expert.'],['Embedded systems and practical electronics','Connected computational hardware with hands-on circuit work, instrumentation, soldering, and embedded applications.'],['Testing assumptions','Tested the prototype approach and documented what worked.'],['Iteration one','Refined the design based on observations and feedback.'],['Midpoint review','Reviewed progress, challenges, and priorities for the next stage.'],['Development sprint','Focused on building the main project features.'],['Integration work','Connected the individual parts into a more complete system.'],['Performance checks','Measured results and looked for reliability improvements.'],['Problem solving','Addressed issues found during testing and tuned the solution.'],['Feature refinement','Improved usability, performance, and presentation.'],['Documentation','Organized the work, decisions, and evidence from the journey.'],['Feedback loop','Collected feedback and used it to make final adjustments.'],['Final testing','Validated the completed work against the original goals.'],['Showcase preparation','Prepared the project story, demonstrations, and key outcomes.'],['Journey recap','Reviewed achievements, lessons learned, and next steps.'],['Next steps','Outlined the next goals and opportunities to continue the Protosem journey.']];
const requested=Number(new URLSearchParams(location.search).get('week')),week=requested>=0&&requested<milestones.length?requested:0,[title,summary]=milestones[week],details=document.getElementById('details'),achievements=document.getElementById('achievements-section'),tags=document.getElementById('achievement-tags');document.title=`Protosem | Week ${week}`;document.getElementById('week-label').textContent=`Protosem · Week ${week}`;document.getElementById('title').textContent=title;document.getElementById('summary').textContent=summary;if(week===0){details.innerHTML='<div class="activity-list"><div><h3>Self introduction</h3><p>Introduced myself, shared my interests, and explained what I hope to learn through Protosem.</p></div><div><h3>Orientation</h3><p>Learned about the Protosem program, its goals, the weekly process, and the expectations for the journey.</p></div><div><h3>Group activities</h3><p>Worked with other participants in introductory activities to connect, exchange ideas, and begin collaborating.</p></div></div>'}else if(week===1){details.innerHTML='<div class="activity-list"><div><h3>Implementation of 5S</h3><p>Applied the 5S method—Sort, Set in order, Shine, Standardize, and Sustain—to keep the workspace organised, clean, and efficient.</p></div><div><h3>GitHub introduction</h3><p>Learned how GitHub is used to store project files, track changes, and collaborate through repositories.</p></div><div><h3>Creating portfolio</h3><p>Created a personal portfolio to present my skills, projects, and learning progress in a professional digital space.</p></div></div>';tags.innerHTML='<span class="tag">Organization</span><span class="tag">Workplace discipline</span><span class="tag">Self presentation</span><span class="tag">Digital presence</span><span class="tag">Efficiency</span>'}else if(week===2){details.innerHTML='<div class="activity-list"><div><h3>Monday — Frugal Innovation and GIE Rubrics</h3><p>Learned to create simple, low-cost solutions that meet real user needs. I also understood how projects are assessed through problem identification, innovation, teamwork, presentation, implementation, impact, and execution.</p></div><div><h3>Tuesday — Algorithms and Flowcharts</h3><p>Practised breaking problems into clear step-by-step algorithms and using flowcharts to visualise program logic before coding. Planning solutions first helps reduce errors.</p></div><div><h3>Wednesday — Scratch and Python Basics</h3><p>Created animations and stories in Scratch using sprites, backdrops, events, loops, and conditions. Learned Python fundamentals including syntax, variables, input/output, comments, indentation, print(), and input().</p></div><div><h3>Thursday — MIT App Inventor and Scratch Project Planning</h3><p>Designed simple Android app interfaces with drag-and-drop components and explored event-driven blocks. I also planned a Scratch project by identifying its story, characters, scenes, and programming logic.</p></div><div><h3>Friday — Design Thinking</h3><p>Learned the five stages of Design Thinking: Empathize, Define, Ideate, Prototype, and Test. This reinforced the importance of understanding users and improving solutions through testing.</p></div></div>';tags.innerHTML='<span class="tag">Problem solving</span><span class="tag">Logical thinking</span><span class="tag">Programming fundamentals</span><span class="tag">Innovation mindset</span><span class="tag">Design thinking</span><span class="tag">Creativity</span><span class="tag">Teamwork</span><span class="tag">Presentation skills</span>'}else if(week===3){details.innerHTML=`<div class="activity-list"><div><h3>Days 1–2 · Hardware and electronics</h3><p>Started with computational hardware and the electrical principles behind it. Covered how power is generated, transmitted, and distributed; the difference between AC and DC; and the relationships between voltage, current, resistance, and power. Looked at how sources, circuits, and loads work together, then studied resistors, capacitors, inductors, and their roles in circuits. Compared DC, AC, stepper, and servo motors as actuators in robotics and automation.</p></div><div><h3>Day 3 · Design and CAD foundations</h3><p>Moved into product design with Autodesk Fusion 360. Practised creating dimensioned 2D sketches, applying constraints for geometric accuracy, and building 3D forms with operations such as extrude, revolve, and fillet. The workflow ran from an idea to a sketch, dimensions and constraints, 3D features, and a finished model.</p></div><div><h3>Day 4 · Clay camera prototype</h3><p>Shaped a camera concept in clay to explore its form and proportions. Photographed the prototype, brought the image into Fusion 360 as a reference, and used it to guide the camera’s geometry, dimensions, and product details in the final CAD model.</p></div><div><h3>Day 5 · Paper rocket and product modelling</h3><p>Designed and flew a paper rocket, observing how its shape, balance, structure, and aerodynamics affected flight. Then modelled the rocket in Fusion 360, along with other simple product and mechanical forms such as a water bottle and components.</p></div><div><h3>From physical idea to digital model</h3><p>The camera work followed clay prototype → reference photo → Fusion 360 image reference → CAD development → final camera model. The rocket activity followed paper build → flight test → design observations → 3D model.</p></div><div><h3>What I took away</h3><p>This week connected electrical and electronics fundamentals with hands-on product development. I gained experience with computational hardware, AC/DC systems, power distribution, components, motors, circuit simulation, sketching, constraints, parametric CAD, physical prototyping, and 3D visualization. Tools included Tinkercad Circuits and Autodesk Fusion 360.</p></div><div><h3>Reflection</h3><p>Week 3 helped me see how engineering ideas move from foundational theory into physical experiments and digital designs. Building a clay camera first and using its image to guide the CAD model showed me how a real prototype can shape a more considered digital product. The paper rocket added a practical way to observe design and flight, then carry those observations into 3D modelling.</p></div></div>`;tags.innerHTML='<span class="tag">Computational hardware</span><span class="tag">Electrical fundamentals</span><span class="tag">Electronics</span><span class="tag">AC/DC systems</span><span class="tag">Power distribution</span><span class="tag">Motors and actuation</span><span class="tag">Tinkercad Circuits</span><span class="tag">Fusion 360</span><span class="tag">CAD modelling</span><span class="tag">Geometric constraints</span><span class="tag">Physical prototyping</span><span class="tag">Product design</span><span class="tag">Problem solving</span>'}else if(week===4){details.innerHTML=`<div class="activity-list"><div><h3>Exploring digital fabrication</h3><p>Week 4 introduced digital fabrication through hands-on exposure to laser cutting and 3D printing. We looked at how a design created digitally can be manufactured as a physical part.</p></div><div><h3>From design to physical prototype</h3><p>The sessions highlighted how fabrication choices affect an engineering result. Parameters, material selection, and accuracy all matter when turning a digital model into a usable physical component.</p></div><div><h3>Alpha team formed</h3><p>The week also reached a team milestone: the Alpha team was formally finalised, establishing the group for the work ahead.</p></div><div><h3>Laser cutting in practice</h3><p>A laser cutting machine was used during the digital fabrication activity, showing one of the tools that can translate a prepared design into a physical component.</p></div><div><h3>Week 4 reflection</h3><p>This week connected digital design with physical making. Learning about laser cutting and 3D printing, alongside the importance of materials, machine settings, and precision, built a clearer picture of how prototypes are produced. Forming the Alpha team made this a key point in the project journey.</p></div></div>`;tags.innerHTML='<span class="tag">Digital fabrication</span><span class="tag">Laser cutting</span><span class="tag">3D printing</span><span class="tag">Prototyping</span><span class="tag">Material selection</span><span class="tag">Accuracy</span><span class="tag">Team formation</span><span class="tag">Alpha team</span>'}else if(week===5){details.innerHTML=`<div class="activity-list"><div><h3>UI/UX design foundations</h3><p>Explored user interface and user experience design, learning that a good product needs more than attractive visuals. It should be clear, usable, accessible, and support a smooth user journey.</p></div><div><h3>Design from the user's perspective</h3><p>Considered user needs, difficulties, context, accessibility, and interaction. The process can be thought of as: understand the user, design a response, test it, and improve it.</p></div><div><h3>Framing the problem</h3><p>Practised building a focused problem statement by identifying the user, the challenge, the setting, why it matters, and the need a solution should address. Clear framing gives research and design decisions a meaningful direction.</p></div><div><h3>Bosch industry session · Project management</h3><p>A half-day session with an industry expert from Bosch introduced practical ways to plan project work, organize tasks, structure activities, and support team coordination.</p></div><div><h3>Mind mapping</h3><p>Used mind mapping to connect ideas and break a large project into manageable parts. A project map can include its objectives, tasks, team, resources, timeline, deliverables, and risks.</p></div><div><h3>Learning reflection</h3><p>This week showed how design, problem-solving, and project management work together. User-focused UI/UX shapes the experience, a well-defined problem keeps the work relevant, and structured planning helps a team move toward a useful solution.</p></div><div><h3>Skills and concepts</h3><p>UI/UX design, user-centred design, usability, accessibility, user journeys, problem identification, problem statement development, design thinking, structured thinking, mind mapping, project planning, task organization, team coordination, communication, problem solving, and innovation.</p></div><div><h3>Key takeaway</h3><p>Start by understanding the user and defining the right problem. With a clear need and an organized plan, it becomes easier to create a meaningful solution.</p></div><div><h3>Week 5 in pictures</h3><p>The activities included interface design in Figma, UI/UX exploration on laptop and mobile interfaces, paper mind mapping, and the Bosch project management session.</p></div></div>`;tags.innerHTML='<span class="tag">UI/UX design</span><span class="tag">User-centred design</span><span class="tag">Usability</span><span class="tag">Accessibility</span><span class="tag">Problem framing</span><span class="tag">Design thinking</span><span class="tag">Mind mapping</span><span class="tag">Project management</span><span class="tag">Project planning</span><span class="tag">Team coordination</span><span class="tag">Figma</span><span class="tag">Innovation</span>'}else if(week===6){details.innerHTML=`<div class="activity-list"><div><h3>Computational hardware and embedded systems</h3><p>Learned how embedded systems combine software and dedicated hardware to sense information, process it, and control physical outputs. Explored microcontrollers, microprocessors, sensors, actuators, and input/output devices. A microcontroller brings processing, memory, and peripherals together in one compact circuit; a microprocessor typically works with external memory and peripherals.</p><p>The basic flow is input from sensors, switches, or user commands → processing by an embedded controller → output through LEDs, motors, actuators, or displays.</p></div><div><h3>Electronic components and measurement</h3><p>Worked with resistors, capacitors, LEDs, wires, and power connections. Resistors limit current or divide voltage, capacitors store charge for uses such as filtering and timing, and LEDs turn electrical energy into light. Used a multimeter to measure components and a digital storage oscilloscope to observe circuit signals and behavior.</p></div><div><h3>Soldering and circuit assembly</h3><p>Practised positioning and handling components, applying heat and solder to form electrical and mechanical connections, and inspecting joints. The assembly process moved from component placement to heating, solder application, joint formation, and inspection, with attention to continuity and electrical safety.</p></div><div><h3>555 timer and practical electronics</h3><p>Assembled a practical circuit using a 555 Timer IC, LEDs, resistors, a capacitor, a power supply, and circuit connections. The activity introduced timing through hands-on construction without relying on undocumented specifications.</p></div><div><h3>ESP32 and embedded output</h3><p>Explored ESP32 LED work on a breadboard and an embedded application programmed on a laptop. The examples showed how a microcontroller can process information and present output through a display or other interface, including a game shown on a small OLED screen.</p></div><div><h3>Skills and tools</h3><p>Developed computational thinking, embedded systems knowledge, component handling, circuit assembly, soldering, instrumentation awareness, measurement, problem solving, and electrical safety. Tools and components included the ESP32, OLED display, 555 Timer IC, multimeter, DSO/oscilloscope, resistors, capacitors, LEDs, and soldering equipment.</p></div><div><h3>Reflection</h3><p>Week 6 connected embedded code with working electronics. Sensors bring information in, the controller processes it, and circuits and actuators create an output. Measuring, assembling, and checking those circuits helped me understand how computational hardware and practical electronics come together in a functional system.</p></div><div><h3>Key learning</h3><p>Reliable engineering depends on each layer working together: computational thinking, embedded hardware, electronic components, careful assembly, and measurement to verify circuit behavior.</p></div></div>`;tags.innerHTML='<span class="tag">Embedded systems</span><span class="tag">Microcontrollers</span><span class="tag">ESP32</span><span class="tag">Sensors and actuators</span><span class="tag">Electronic components</span><span class="tag">Circuit assembly</span><span class="tag">Soldering</span><span class="tag">Multimeter</span><span class="tag">Oscilloscope</span><span class="tag">555 Timer</span><span class="tag">OLED display</span><span class="tag">Electrical safety</span>'}else{details.textContent=`${summary} This page is the dedicated record for Week ${week}, where the work completed and outcomes can be presented.`;achievements.hidden=true}
</script>

<script>
const milestones=[['Getting started','Introduced the Protosem program, set goals, and mapped the learning journey.'],['Foundation building','Strengthened the core concepts needed for the project work ahead.'],['Learning presentation','Developed programming fundamentals, innovation thinking, and problem-solving skills through hands-on learning.'],['Hardware to product design','Explored computational hardware and electronics, then applied design skills through physical prototyping and 3D CAD modelling.'],['Planning the build','Defined the workflow, resources, and first implementation tasks.'],['Skill practice','Practised the key technical skills required for the selected project.'],['Early prototype','Created an initial proof of concept and identified improvement areas.'],['Testing assumptions','Tested the prototype approach and documented what worked.'],['Iteration one','Refined the design based on observations and feedback.'],['Midpoint review','Reviewed progress, challenges, and priorities for the next stage.'],['Development sprint','Focused on building the main project features.'],['Integration work','Connected the individual parts into a more complete system.'],['Performance checks','Measured results and looked for reliability improvements.'],['Problem solving','Addressed issues found during testing and tuned the solution.'],['Feature refinement','Improved usability, performance, and presentation.'],['Documentation','Organized the work, decisions, and evidence from the journey.'],['Feedback loop','Collected feedback and used it to make final adjustments.'],['Final testing','Validated the completed work against the original goals.'],['Showcase preparation','Prepared the project story, demonstrations, and key outcomes.'],['Journey recap','Reviewed achievements, lessons learned, and next steps.'],['Next steps','Outlined the next goals and opportunities to continue the Protosem journey.']];
const requested=Number(new URLSearchParams(location.search).get('week')),week=requested>=0&&requested<milestones.length?requested:0,[title,summary]=milestones[week],details=document.getElementById('details'),achievements=document.getElementById('achievements-section'),tags=document.getElementById('achievement-tags');document.title=`Protosem | Week ${week}`;document.getElementById('week-label').textContent=`Protosem · Week ${week}`;document.getElementById('title').textContent=title;document.getElementById('summary').textContent=summary;if(week===0){details.innerHTML='<div class="activity-list"><div><h3>Self introduction</h3><p>Introduced myself, shared my interests, and explained what I hope to learn through Protosem.</p></div><div><h3>Orientation</h3><p>Learned about the Protosem program, its goals, the weekly process, and the expectations for the journey.</p></div><div><h3>Group activities</h3><p>Worked with other participants in introductory activities to connect, exchange ideas, and begin collaborating.</p></div></div>'}else if(week===1){details.innerHTML='<div class="activity-list"><div><h3>Implementation of 5S</h3><p>Applied the 5S method—Sort, Set in order, Shine, Standardize, and Sustain—to keep the workspace organised, clean, and efficient.</p></div><div><h3>GitHub introduction</h3><p>Learned how GitHub is used to store project files, track changes, and collaborate through repositories.</p></div><div><h3>Creating portfolio</h3><p>Created a personal portfolio to present my skills, projects, and learning progress in a professional digital space.</p></div></div>';tags.innerHTML='<span class="tag">Organization</span><span class="tag">Workplace discipline</span><span class="tag">Self presentation</span><span class="tag">Digital presence</span><span class="tag">Efficiency</span>'}else if(week===2){details.innerHTML='<div class="activity-list"><div><h3>Monday — Frugal Innovation and GIE Rubrics</h3><p>Learned to create simple, low-cost solutions that meet real user needs. I also understood how projects are assessed through problem identification, innovation, teamwork, presentation, implementation, impact, and execution.</p></div><div><h3>Tuesday — Algorithms and Flowcharts</h3><p>Practised breaking problems into clear step-by-step algorithms and using flowcharts to visualise program logic before coding. Planning solutions first helps reduce errors.</p></div><div><h3>Wednesday — Scratch and Python Basics</h3><p>Created animations and stories in Scratch using sprites, backdrops, events, loops, and conditions. Learned Python fundamentals including syntax, variables, input/output, comments, indentation, print(), and input().</p></div><div><h3>Thursday — MIT App Inventor and Scratch Project Planning</h3><p>Designed simple Android app interfaces with drag-and-drop components and explored event-driven blocks. I also planned a Scratch project by identifying its story, characters, scenes, and programming logic.</p></div><div><h3>Friday — Design Thinking</h3><p>Learned the five stages of Design Thinking: Empathize, Define, Ideate, Prototype, and Test. This reinforced the importance of understanding users and improving solutions through testing.</p></div></div>';tags.innerHTML='<span class="tag">Problem solving</span><span class="tag">Logical thinking</span><span class="tag">Programming fundamentals</span><span class="tag">Innovation mindset</span><span class="tag">Design thinking</span><span class="tag">Creativity</span><span class="tag">Teamwork</span><span class="tag">Presentation skills</span>'}else if(week===3){details.innerHTML=`<div class="activity-list"><div><h3>Days 1–2 · Hardware and electronics</h3><p>Started with computational hardware and the electrical principles behind it. Covered how power is generated, transmitted, and distributed; the difference between AC and DC; and the relationships between voltage, current, resistance, and power. Looked at how sources, circuits, and loads work together, then studied resistors, capacitors, inductors, and their roles in circuits. Compared DC, AC, stepper, and servo motors as actuators in robotics and automation.</p></div><div><h3>Day 3 · Design and CAD foundations</h3><p>Moved into product design with Autodesk Fusion 360. Practised creating dimensioned 2D sketches, applying constraints for geometric accuracy, and building 3D forms with operations such as extrude, revolve, and fillet. The workflow ran from an idea to a sketch, dimensions and constraints, 3D features, and a finished model.</p></div><div><h3>Day 4 · Clay camera prototype</h3><p>Shaped a camera concept in clay to explore its form and proportions. Photographed the prototype, brought the image into Fusion 360 as a reference, and used it to guide the camera’s geometry, dimensions, and product details in the final CAD model.</p></div><div><h3>Day 5 · Paper rocket and product modelling</h3><p>Designed and flew a paper rocket, observing how its shape, balance, structure, and aerodynamics affected flight. Then modelled the rocket in Fusion 360, along with other simple product and mechanical forms such as a water bottle and components.</p></div><div><h3>From physical idea to digital model</h3><p>The camera work followed clay prototype → reference photo → Fusion 360 image reference → CAD development → final camera model. The rocket activity followed paper build → flight test → design observations → 3D model.</p></div><div><h3>What I took away</h3><p>This week connected electrical and electronics fundamentals with hands-on product development. I gained experience with computational hardware, AC/DC systems, power distribution, components, motors, circuit simulation, sketching, constraints, parametric CAD, physical prototyping, and 3D visualization. Tools included Tinkercad Circuits and Autodesk Fusion 360.</p></div><div><h3>Reflection</h3><p>Week 3 helped me see how engineering ideas move from foundational theory into physical experiments and digital designs. Building a clay camera first and using its image to guide the CAD model showed me how a real prototype can shape a more considered digital product. The paper rocket added a practical way to observe design and flight, then carry those observations into 3D modelling.</p></div></div>`;tags.innerHTML='<span class="tag">Computational hardware</span><span class="tag">Electrical fundamentals</span><span class="tag">Electronics</span><span class="tag">AC/DC systems</span><span class="tag">Power distribution</span><span class="tag">Motors and actuation</span><span class="tag">Tinkercad Circuits</span><span class="tag">Fusion 360</span><span class="tag">CAD modelling</span><span class="tag">Geometric constraints</span><span class="tag">Physical prototyping</span><span class="tag">Product design</span><span class="tag">Problem solving</span>'}else{details.textContent=`${summary} This page is the dedicated record for Week ${week}, where the work completed and outcomes can be presented.`;achievements.hidden=true}
</script>
